<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Week 3: Shop Choices</title>

<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        font-family: Arial, Helvetica, sans-serif;
        background: #f3f5f7;
        color: #17212b;
    }

    .page {
        max-width: 1150px;
        margin: 0 auto;
        padding: 30px 20px 50px;
    }

    .header {
        background: #2a5673;
        color: white;
        border-radius: 14px;
        padding: 24px 30px;
        margin-bottom: 22px;
        box-shadow: 0 3px 10px rgba(0,0,0,.08);
    }

    .header h1 {
        margin: 0 0 8px;
        font-size: 30px;
    }

    .header p {
        margin: 0;
        font-size: 17px;
        line-height: 1.4;
        opacity: .95;
    }

    .progress-wrap {
        margin: 18px 0 26px;
    }

    .progress-text {
        font-size: 14px;
        font-weight: bold;
        margin-bottom: 7px;
        color: #425466;
    }

    .progress-bar {
        height: 10px;
        background: #dce3e8;
        border-radius: 10px;
        overflow: hidden;
    }

    .progress-fill {
        height: 100%;
        width: 0%;
        background: #f5b82e;
        transition: width .35s ease;
    }

    .scenario {
        background: white;
        border: 1px solid #d2dce3;
        border-radius: 16px;
        padding: 28px;
        margin-bottom: 24px;
    }

    .time-label {
        font-size: 14px;
        font-weight: bold;
        color: #2a5673;
        text-transform: uppercase;
        letter-spacing: .6px;
        margin-bottom: 7px;
    }

    .scenario h2 {
        margin: 0 0 12px;
        font-size: 25px;
    }

    .scenario p {
        font-size: 18px;
        line-height: 1.55;
        margin: 0;
    }

    .choices {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 24px;
    }

    .choice {
        position: relative;
        background: #f8fafb;
        border: 2px solid #cbd9e2;
        border-radius: 16px;
        padding: 40px 28px 28px;
        cursor: pointer;
        transition: .18s ease;
        min-height: 205px;
    }

    .choice:hover {
        transform: translateY(-3px);
        border-color: #2a5673;
        box-shadow: 0 5px 14px rgba(0,0,0,.08);
    }

    .choice-letter {
        position: absolute;
        top: 18px;
        left: 28px;
        width: 43px;
        height: 43px;
        background: #f5b82e;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 18px;
        font-weight: bold;
        color: #111;
    }

    .choice h3 {
        margin: 45px 0 9px;
        font-size: 21px;
    }

    .choice p {
        margin: 0;
        font-size: 17px;
        line-height: 1.45;
    }

    .result {
        display: none;
        background: white;
        border-left: 6px solid #2a5673;
        border-radius: 10px;
        padding: 24px;
        margin-top: 24px;
    }

    .result h3 {
        margin-top: 0;
        font-size: 21px;
    }

    .result p {
        font-size: 17px;
        line-height: 1.5;
    }

    .continue-btn,
    .restart-btn {
        border: 0;
        background: #2a5673;
        color: white;
        font-size: 17px;
        font-weight: bold;
        padding: 13px 22px;
        border-radius: 9px;
        cursor: pointer;
        margin-top: 12px;
    }

    .continue-btn:hover,
    .restart-btn:hover {
        background: #1e4259;
    }

    .ending {
        text-align: center;
        background: white;
        border-radius: 18px;
        padding: 38px 30px;
        border: 1px solid #d2dce3;
    }

    .ending-badge {
        width: 74px;
        height: 74px;
        margin: 0 auto 18px;
        border-radius: 50%;
        background: #f5b82e;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 34px;
    }

    .ending h2 {
        font-size: 30px;
        margin: 0 0 12px;
        color: #2a5673;
    }

    .ending p {
        max-width: 760px;
        margin: 0 auto 15px;
        font-size: 18px;
        line-height: 1.6;
    }

    .reflection {
        margin-top: 28px;
        background: #eef3f6;
        border-radius: 12px;
        padding: 20px;
        text-align: left;
    }

    .reflection strong {
        color: #2a5673;
    }

    @media (max-width: 760px) {
        .choices {
            grid-template-columns: 1fr;
        }

        .header h1 {
            font-size: 25px;
        }

        .scenario {
            padding: 22px;
        }
    }
</style>
</head>

<body>

<div class="page">

    <div class="header">
        <h1>Your Third Week on the Job</h1>
        <p>
            You've made it through your first two weeks at the shop.
            You're still in your 30-day probationary period, and people are starting
            to form an opinion about the kind of employee you'll be.
        </p>
    </div>

    <div class="progress-wrap">
        <div class="progress-text" id="progressText">Decision 1 of 8</div>
        <div class="progress-bar">
            <div class="progress-fill" id="progressFill"></div>
        </div>
    </div>

    <div id="game"></div>

</div>

<script>

const scenarios = [

{
    time: "7:52 AM",
    title: "You Arrive at the Shop",
    text: `
        Your shift begins at 8:00 AM. You walk into the building at 7:52 with your
        backpack, lunch, and work shirt. A few technicians are already out in the shop.
    `,
    choices: [
        {
            title: "Clock in when you arrive",
            text: `
                Clock in now, then put your belongings away, get your uniform situated,
                and head into the shop.
            `,
            score: 1,
            result: `
                You clock in and begin getting situated. You're technically at work,
                but several minutes of paid time pass before you're actually ready
                to begin your assignment.
            `
        },
        {
            title: "Clock in when you're ready",
            text: `
                Put your belongings away, get your uniform situated, and make sure
                you're ready to start working before clocking in.
            `,
            score: 2,
            result: `
                You get yourself situated first and clock in just before 8:00.
                When your shift begins, you're already prepared to head directly
                into the shop.
            `
        }
    ]
},

{
    time: "8:35 AM",
    title: "Someone Needs a Hand",
    text: `
        You've just started an oil service your supervisor assigned to you.
        A technician working two bays over asks if you can help him hold a component
        in place for a few minutes. Your vehicle isn't urgent, but you've already
        started working on it.
    `,
    choices: [
        {
            title: "Help him now",
            text: `
                Step away from your vehicle for a few minutes and help the technician.
                You can return to your oil service when he's finished.
            `,
            score: 1,
            result: `
                The technician appreciates the help. When you return, though, you
                have to reorient yourself to where you were in your own job.
                Nothing goes wrong, but your work was interrupted.
            `
        },
        {
            title: "Finish your current step first",
            text: `
                Tell him you'll help as soon as you finish the step you're currently on
                and leave your vehicle in a safe stopping point.
            `,
            score: 2,
            result: `
                You finish the step you're on, make sure the vehicle is left safely,
                and then go help. He waits a few extra minutes, but both jobs stay organized.
            `
        }
    ]
},

{
    time: "9:20 AM",
    title: "The Procedure Looks Familiar",
    text: `
        Your next assignment is a repair you've seen demonstrated before.
        You understand the general process, but this particular vehicle is a different
        model than the one you practiced on. The shop is busy and everyone else appears
        to be working.
    `,
    choices: [
        {
            title: "Start with what you know",
            text: `
                Begin the repair using the process you're familiar with.
                If something looks different once you get into the job, stop and check.
            `,
            score: 1,
            result: `
                Most of the procedure is familiar. Once you're partway into the job,
                you find that one step is different on this model and have to stop
                to verify the procedure.
            `
        },
        {
            title: "Verify the procedure first",
            text: `
                Spend a few minutes checking the service information for this model
                before taking anything apart.
            `,
            score: 2,
            result: `
                The basic repair is exactly what you expected, but you catch one
                model-specific instruction before beginning. It costs a few minutes
                up front and prevents you from having to backtrack.
            `
        }
    ]
},

{
    time: "10:45 AM",
    title: "The Vehicle Is Already Outside",
    text: `
        Earlier this morning you completed a tire rotation. The vehicle has already
        been moved outside and is waiting for the customer. While cleaning your bay,
        you notice the torque wrench you were using still sitting beside the lift.
    `,
    choices: [
        {
            title: "Put the tool away",
            text: `
                You followed your normal process when you completed the job.
                Put the torque wrench away and continue to your next assignment.
            `,
            score: 0,
            result: `
                The vehicle remains outside ready for pickup. Nothing immediately
                indicates that anything is wrong, and the shop continues moving.
                You've decided to trust the process you remember completing.
            `
        },
        {
            title: "Bring the vehicle back in",
            text: `
                Take a few minutes to bring the vehicle back into the shop and verify
                the wheel torque before the customer arrives.
            `,
            score: 3,
            result: `
                You bring the vehicle back inside and verify every wheel.
                They are properly torqued. The extra check doesn't change the repair,
                but it removes any uncertainty before the vehicle leaves the shop.
            `
        }
    ]
},

{
    time: "12:05 PM",
    title: "You're Almost Finished",
    text: `
        Lunch starts at noon. You're five minutes into lunch time, but you're only
        a few minutes away from finishing the vehicle in your bay. The rest of the
        group has already headed toward the break room.
    `,
    choices: [
        {
            title: "Finish the vehicle first",
            text: `
                Stay on the job for a few more minutes, finish what you're doing,
                then take your lunch.
            `,
            score: 2,
            result: `
                You finish the vehicle and leave the bay in a good stopping point.
                Your lunch starts a little later than everyone else's, but the job
                doesn't sit half-finished.
            `
        },
        {
            title: "Take lunch with everyone else",
            text: `
                Leave the vehicle where it is and take your scheduled lunch.
                You'll finish the remaining work when lunch is over.
            `,
            score: 1,
            result: `
                You take your lunch at the scheduled time. The vehicle remains
                partially completed until you return. The situation is safe,
                but the job is delayed until after lunch.
            `
        }
    ]
},

{
    time: "1:40 PM",
    title: "The Customer Asks You Directly",
    text: `
        While you're moving a vehicle, its owner sees you in the parking lot and asks,
        "Do you think it's going to need brakes?" You've seen the inspection notes,
        and the pads are getting low, but nobody has discussed the repair with the
        customer yet.
    `,
    choices: [
        {
            title: "Answer the question",
            text: `
                Tell the customer that the brakes are getting low and they'll probably
                need to be replaced soon. You're only explaining what you observed.
            `,
            score: 1,
            result: `
                Your answer is reasonable, but the customer immediately begins asking
                about price, urgency, and whether the vehicle is safe to drive.
                You're now having a conversation that normally belongs with the person
                handling the repair order.
            `
        },
        {
            title: "Send them to the right person",
            text: `
                Tell the customer that the inspection is being documented and the
                service advisor or supervisor will go over the findings with them.
            `,
            score: 2,
            result: `
                You acknowledge the customer's question without ignoring them,
                but leave the repair recommendation and pricing conversation with
                the person responsible for communicating it.
            `
        }
    ]
},

{
    time: "4:35 PM",
    title: "A Job Runs Longer Than Expected",
    text: `
        Your shift ends at 5:00. You're helping with a vehicle that was expected to
        be finished today, but the repair is running behind. You have plans at 5:30
        that will be difficult to move. The technician you're working with looks like
        he'll still be there after 5:00.
    `,
    choices: [
        {
            title: "Plan to leave at 5:00",
            text: `
                Let the technician know before the end of the shift that you need
                to leave on time. Finish as much as you can and make sure he knows
                exactly where the job stands.
            `,
            score: 2,
            result: `
                You give him advance notice and work until the end of your scheduled
                shift. At 5:00, he knows exactly what has been completed and what
                still needs to be done.
            `
        },
        {
            title: "Stay until the job is done",
            text: `
                Your plans matter, but the team is trying to finish the vehicle today.
                Stay after your scheduled shift and help finish the repair.
            `,
            score: 2,
            result: `
                You stay and help move the job forward. Your coworker notices the effort,
                although staying late also means changing plans you had already made
                outside of work.
            `
        }
    ]
},

{
    time: "5:12 PM",
    title: "One Last Thing",
    text: `
        Before leaving, you notice some tools and shop equipment from today's work
        haven't been returned to their normal locations. Most of the other technicians
        are wrapping up too.
    `,
    choices: [
        {
            title: "Take care of your area",
            text: `
                Make sure the tools and equipment you used are returned and your
                work area is ready for tomorrow before leaving.
            `,
            score: 2,
            result: `
                You take a few minutes to reset your work area. Tomorrow's shift can
                begin without having to search for tools or clean up today's work.
            `
        },
        {
            title: "Leave with the rest of the group",
            text: `
                The day is over and everyone is heading out. Anything left can be
                dealt with first thing tomorrow morning.
            `,
            score: 0,
            result: `
                You leave for the day. The next morning, some of the first few minutes
                of the shift are spent putting away equipment that could have been
                handled the night before.
            `
        }
    ]
}

];

let currentScenario = 0;
let totalScore = 0;
let choicesMade = [];

function renderScenario() {

    const scenario = scenarios[currentScenario];
    const game = document.getElementById("game");

    document.getElementById("progressText").textContent =
        `Decision ${currentScenario + 1} of ${scenarios.length}`;

    document.getElementById("progressFill").style.width =
        `${((currentScenario) / scenarios.length) * 100}%`;

    game.innerHTML = `
        <div class="scenario">

            <div class="time-label">${scenario.time}</div>

            <h2>${scenario.title}</h2>

            <p>${scenario.text}</p>

        </div>

        <div class="choices">

            <div class="choice" onclick="choose(0)">
                <div class="choice-letter">A</div>
                <h3>${scenario.choices[0].title}</h3>
                <p>${scenario.choices[0].text}</p>
            </div>

            <div class="choice" onclick="choose(1)">
                <div class="choice-letter">B</div>
                <h3>${scenario.choices[1].title}</h3>
                <p>${scenario.choices[1].text}</p>
            </div>

        </div>

        <div class="result" id="result"></div>
    `;
}

function choose(choiceIndex) {

    const scenario = scenarios[currentScenario];
    const choice = scenario.choices[choiceIndex];

    totalScore += choice.score;

    choicesMade.push({
        scenario: scenario.title,
        choice: choice.title,
        score: choice.score
    });

    document.querySelectorAll(".choice").forEach(card => {
        card.style.pointerEvents = "none";
        card.style.opacity = ".55";
    });

    const result = document.getElementById("result");

    result.innerHTML = `
        <h3>What happens next?</h3>

        <p>${choice.result}</p>

        <button class="continue-btn" onclick="nextScenario()">
            Continue
        </button>
    `;

    result.style.display = "block";
    result.scrollIntoView({
        behavior: "smooth",
        block: "nearest"
    });
}

function nextScenario() {

    currentScenario++;

    if (currentScenario < scenarios.length) {

        window.scrollTo({
            top: 0,
            behavior: "smooth"
        });

        setTimeout(renderScenario, 200);

    } else {

        showEnding();

    }
}

function showEnding() {

    document.getElementById("progressText").textContent = "Your Day Is Complete";
    document.getElementById("progressFill").style.width = "100%";

    const game = document.getElementById("game");

    let title;
    let message;
    let badge;

    /*
        Maximum score = 17

        14–17 = Excellent
        10–13 = Solid
        6–9   = Needs consistency
        0–5   = Probation concern
    */

    if (totalScore >= 14) {

        badge = "★";
        title = "Your Work Is Getting Noticed";

        message = `
            Over your first few weeks, you've shown that you can be trusted to think
            through situations instead of simply waiting for someone to tell you what
            to do. You work safely, communicate well, and take responsibility for
            the quality of your work.
            <br><br>
            At the end of your 30-day probationary period, the shop offers you the
            position permanently. The offer includes a pay increase.
            <br><br>
            Your supervisor also tells you that if you continue working this way,
            you'll be selected for additional manufacturer and industry training
            that can lead to advanced certifications and greater responsibility.
        `;

    }

    else if (totalScore >= 10) {

        badge = "✓";
        title = "You've Earned the Position";

        message = `
            Your first month hasn't been perfect, but you've shown that you're dependable
            and capable of learning from experience. Your supervisor has seen enough
            to believe you're worth developing.
            <br><br>
            You successfully complete your probationary period and are offered the
            permanent position with the normal increase in pay.
            <br><br>
            Your next challenge is becoming more consistent in the small decisions
            that separate someone who completes work from someone the shop can
            fully depend on.
        `;

    }

    else if (totalScore >= 6) {

        badge = "!";
        title = "You're Still Being Evaluated";

        message = `
            You've shown that you can perform the work, but your supervisor has noticed
            some inconsistency in the way you handle responsibility, communication,
            and quality control.
            <br><br>
            Instead of immediately offering you the permanent position, the shop extends
            your evaluation period. You're given another opportunity to prove that
            you can make good decisions consistently without constant supervision.
        `;

    }

    else {

        badge = "×";
        title = "Your Probationary Period Ends";

        message = `
            Individually, many of your decisions may have seemed small. Together,
            however, they've created concerns about reliability, judgment, and whether
            the shop can trust you to work independently.
            <br><br>
            At the end of the probationary period, the shop decides not to offer you
            the permanent position.
            <br><br>
            The issue wasn't one single mistake. It was the pattern created by the
            decisions you made throughout the workday.
        `;
    }

    game.innerHTML = `
        <div class="ending">

            <div class="ending-badge">${badge}</div>

            <h2>${title}</h2>

            <p>${message}</p>

            <div class="reflection">
                <strong>Think about it:</strong><br><br>
                Which decision was the hardest for you to make?
                Was there a choice where both options seemed reasonable?
                What information ultimately influenced your decision?
            </div>

            <button class="restart-btn" onclick="restartGame()">
                Start Over
            </button>

        </div>
    `;

    window.scrollTo({
        top: 0,
        behavior: "smooth"
    });
}

function restartGame() {

    currentScenario = 0;
    totalScore = 0;
    choicesMade = [];

    renderScenario();

    window.scrollTo({
        top: 0,
        behavior: "smooth"
    });
}

renderScenario();

</script>

</body>
</html>
