<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Choices | Professionalism</title>


<style>
    :root {
        --navy-950: #07131c;
        --navy-900: #0c1d29;
        --navy-850: #102635;
        --navy-800: #16384d;
        --navy-700: #214d67;
        --navy-600: #2a5673;
        --gold: #ffd34e;
        --gold-strong: #f4b62c;
        --paper: #f7f9fb;
        --paper-2: #eef3f6;
        --ink: #18232b;
        --muted: #657684;
        --line: #cad6de;
        --white: #ffffff;
        --shadow: 0 20px 55px rgba(0,0,0,.34);
    }

    * {
        box-sizing: border-box;
    }

    html, body {
        margin: 0;
        padding: 0;
        min-height: 100%;
        font-family: Arial, Helvetica, sans-serif;
        background:
            radial-gradient(circle at 20% 0%, rgba(42,86,115,.34), transparent 28rem),
            linear-gradient(145deg, var(--navy-850), var(--navy-950) 72%);
        color: var(--white);
    }

    body {
        min-height: 100vh;
        background-attachment: fixed;
    }

    body::before {
        content: "";
        position: fixed;
        inset: 0;
        pointer-events: none;
        opacity: .16;
        background:
            linear-gradient(90deg, transparent 49.5%, rgba(255,255,255,.025) 50%, transparent 50.5%),
            linear-gradient(0deg, transparent 49.5%, rgba(255,255,255,.018) 50%, transparent 50.5%);
        background-size: 40px 40px;
    }

    .app {
        width: min(1180px, 94%);
        margin: 0 auto;
        padding: 24px 0 70px;
        position: relative;
        z-index: 1;
    }

    .topbar {
        display: grid;
        grid-template-columns: auto 1fr auto;
        align-items: center;
        gap: 18px;
        margin-bottom: 10px;
        color: #c9d7df;
        font-size: .9rem;
    }

    .topbar::before {
        content: "◆";
        display: grid;
        place-items: center;
        width: 38px;
        height: 38px;
        border-radius: 50%;
        background: var(--gold);
        color: var(--navy-950);
        font-size: 16px;
        font-weight: 900;
        box-shadow: 0 0 0 5px rgba(255,211,78,.08);
    }

    .brand {
        font-weight: 900;
        letter-spacing: .16em;
        color: var(--white);
        font-size: 1rem;
    }

    .brand::after {
        content: "  •  PROFESSIONALISM";
        color: var(--gold);
        letter-spacing: .08em;
        font-size: .78rem;
    }

    #statusText {
        justify-self: end;
        color: #d8e2e8;
        font-weight: 700;
    }

    .progress-track {
        width: 100%;
        height: 10px;
        background: rgba(255,255,255,.11);
        border-radius: 999px;
        overflow: hidden;
        margin-bottom: 24px;
        box-shadow: inset 0 1px 2px rgba(0,0,0,.25);
    }

    .progress-fill {
        height: 100%;
        width: 0;
        background: linear-gradient(90deg, var(--gold-strong), var(--gold));
        transition: width .35s ease;
        box-shadow: 0 0 16px rgba(255,211,78,.3);
    }

    .card {
        position: relative;
        overflow: hidden;
        background:
            linear-gradient(135deg, rgba(255,255,255,.99), rgba(242,246,249,.98));
        color: var(--ink);
        border-radius: 22px;
        padding: 40px;
        box-shadow: var(--shadow);
        border: 1px solid rgba(255,255,255,.65);
        border-top: 8px solid var(--gold);
    }

    .card::after {
        content: "";
        position: absolute;
        top: 0;
        right: 0;
        width: 240px;
        height: 240px;
        background: radial-gradient(circle at top right, rgba(42,86,115,.10), transparent 68%);
        pointer-events: none;
    }

    .eyebrow {
        display: inline-block;
        font-size: .78rem;
        font-weight: 900;
        letter-spacing: .14em;
        text-transform: uppercase;
        color: var(--navy-600);
        margin-bottom: 12px;
    }

    h1 {
        margin: 0 0 18px;
        font-size: clamp(2.3rem, 5vw, 4.25rem);
        line-height: .98;
        color: var(--navy-800);
        letter-spacing: -.035em;
    }

    h2 {
        margin-top: 0;
        color: var(--navy-800);
        font-size: clamp(1.8rem, 4vw, 2.65rem);
        letter-spacing: -.02em;
    }

    h3 {
        color: var(--navy-800);
        margin-bottom: 8px;
    }

    p {
        font-size: 1.08rem;
        line-height: 1.66;
    }

    .lead {
        font-size: 1.26rem;
        color: #263845;
    }

    .highlight {
        background: linear-gradient(135deg, #eef4f7, #e7eef2);
        border-left: 5px solid var(--navy-600);
        border-radius: 11px;
        padding: 18px 20px;
        margin: 22px 0;
        box-shadow: inset 0 0 0 1px rgba(42,86,115,.06);
    }

    .quote {
        background: linear-gradient(135deg, #fff8dc, #f7f0cd);
        border-left: 5px solid var(--gold-strong);
        padding: 18px 20px;
        border-radius: 11px;
        font-weight: 800;
        margin: 20px 0;
    }

    .time-pill {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 9px 14px;
        background: var(--navy-800);
        color: white;
        border-radius: 999px;
        font-weight: 900;
        margin-bottom: 16px;
        box-shadow: 0 5px 14px rgba(23,56,77,.18);
    }

    .time-pill::before {
        content: "◷";
        color: var(--gold);
        font-size: 1.05rem;
    }

    .choices {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 22px;
        margin-top: 32px;
        position: relative;
        z-index: 2;
    }

    .choice {
        border: 2px solid var(--line);
        background:
            linear-gradient(180deg, #ffffff 0%, #f6f9fb 100%);
        border-radius: 17px;
        padding: 24px;
        text-align: left;
        cursor: pointer;
        transition: .2s ease;
        min-height: 195px;
        color: #17232b;
        box-shadow: 0 8px 24px rgba(19,49,67,.06);
        position: relative;
        overflow: hidden;
    }

    .choice::after {
        content: "";
        position: absolute;
        inset: 0;
        border-radius: inherit;
        pointer-events: none;
        box-shadow: inset 0 0 0 0 rgba(255,211,78,0);
        transition: .2s ease;
    }

    .choice:hover {
        transform: translateY(-4px);
        border-color: var(--gold-strong);
        box-shadow: 0 14px 30px rgba(0,0,0,.13);
    }

    .choice:hover::after {
        box-shadow: inset 0 0 0 2px rgba(255,211,78,.18);
    }

    .choice strong {
        display: block;
        color: var(--navy-800);
        font-size: 1.16rem;
        margin-bottom: 10px;
    }

    .choice-letter {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 42px;
        height: 42px;
        border-radius: 12px;
        background: linear-gradient(145deg, var(--gold), var(--gold-strong));
        color: var(--navy-950);
        font-weight: 900;
        font-size: 1.12rem;
        margin-bottom: 15px;
        box-shadow: 0 6px 14px rgba(244,182,44,.22);
    }

    button.primary {
        border: none;
        background: linear-gradient(135deg, var(--gold), var(--gold-strong));
        color: var(--navy-950);
        padding: 15px 26px;
        border-radius: 11px;
        font-size: 1rem;
        font-weight: 900;
        cursor: pointer;
        transition: .18s ease;
        box-shadow: 0 8px 18px rgba(244,182,44,.22);
    }

    button.primary:hover {
        transform: translateY(-2px);
        filter: brightness(1.035);
    }

    button.secondary {
        border: 2px solid var(--navy-600);
        background: transparent;
        color: var(--navy-800);
        padding: 13px 23px;
        border-radius: 11px;
        font-size: 1rem;
        font-weight: 800;
        cursor: pointer;
        transition: .18s ease;
    }

    button.secondary:hover {
        background: var(--paper-2);
        transform: translateY(-1px);
    }

    .consequence {
        border-left: 7px solid var(--gold-strong);
        border-top-color: var(--navy-600);
    }

    .consequence::before {
        content: "CONSEQUENCE";
        position: absolute;
        top: 18px;
        right: 24px;
        font-size: .72rem;
        letter-spacing: .16em;
        font-weight: 900;
        color: rgba(23,56,77,.38);
    }

    .review-card {
        border-top-color: var(--gold);
    }

    .review-card::before {
        content: "30-DAY REVIEW";
        position: absolute;
        top: 20px;
        right: 24px;
        font-size: .72rem;
        letter-spacing: .16em;
        font-weight: 900;
        color: rgba(23,56,77,.38);
    }

    .review-result {
        font-size: 1.35rem;
        font-weight: 900;
        color: var(--navy-800);
        margin: 20px 0;
    }

    .final-message {
        text-align: center;
        padding-top: 10px;
    }

    .final-message h2 {
        font-size: clamp(2rem, 5vw, 3.2rem);
    }

    .small {
        font-size: .92rem;
        color: #53636d;
    }

    .hidden {
        display: none;
    }

    .section-break {
        text-align: center;
        color: #ffffff;
        padding: 82px 20px;
        border: 1px solid rgba(255,255,255,.10);
        border-radius: 24px;
        background:
            linear-gradient(145deg, rgba(17,45,62,.94), rgba(7,19,28,.94));
        box-shadow: var(--shadow);
        position: relative;
        overflow: hidden;
    }

    .section-break::before {
        content: "";
        position: absolute;
        inset: 0;
        background:
            radial-gradient(circle at 50% 10%, rgba(255,211,78,.11), transparent 20rem),
            linear-gradient(90deg, transparent, rgba(255,255,255,.025), transparent);
        pointer-events: none;
    }

    .section-break > * {
        position: relative;
        z-index: 1;
    }

    .section-break h1 {
        color: var(--gold);
        text-shadow: 0 8px 28px rgba(0,0,0,.22);
    }

    .section-break p {
        color: #dce6ec;
        max-width: 680px;
        margin-left: auto;
        margin-right: auto;
    }


    .scenario-visual, .review-visual {
        position: relative;
        z-index: 2;
        width: 100%;
        margin: 20px 0 26px;
        border-radius: 16px;
        overflow: hidden;
        background: var(--navy-900);
        border: 1px solid rgba(22,56,77,.18);
        box-shadow: 0 14px 32px rgba(0,0,0,.16);
    }
    .scenario-visual img, .review-visual img {
        display: block;
        width: 100%;
        height: 280px;
        object-fit: cover;
    }
    .scenario-image-caption, .review-image-caption {
        padding: 9px 13px 10px;
        background: linear-gradient(90deg, var(--navy-900), var(--navy-800));
        font-size: .78rem;
        font-weight: 900;
        letter-spacing: .08em;
        text-transform: uppercase;
    }
    .scenario-image-caption { color: #dce7ed; }
    .review-image-caption { color: var(--gold); text-align: center; }
    @media (max-width: 760px) {
        .scenario-visual, .review-visual { margin: 14px 0 18px; border-radius: 12px; }
        .scenario-visual img, .review-visual img { height: 210px; }
    }

    @media (min-width: 980px) {
        .card {
            padding: 44px 48px;
        }

        .card > p,
        .card > .highlight,
        .card > .quote,
        .card > h2,
        .card > .time-pill,
        .card > .eyebrow {
            max-width: 900px;
        }
    }

    @media (max-width: 760px) {
        .app {
            width: 95%;
            padding-top: 16px;
        }

        .topbar {
            grid-template-columns: auto 1fr;
        }

        #statusText {
            grid-column: 1 / -1;
            justify-self: start;
            padding-left: 56px;
            margin-top: -9px;
        }

        .card {
            padding: 26px 20px;
            border-radius: 17px;
        }

        .choices {
            grid-template-columns: 1fr;
        }

        .choice {
            min-height: auto;
        }

        .brand {
            font-size: .92rem;
        }

        .brand::after {
            display: block;
            margin-top: 3px;
        }

        .section-break {
            padding: 58px 18px;
        }
    }
</style>

</head>

<body>

<div class="app">

    <div class="topbar">
        <div class="brand">CHOICES</div>
        <div id="statusText"></div>
    </div>

    <div class="progress-track" id="progressTrack">
        <div class="progress-fill" id="progressFill"></div>
    </div>

    <main id="screen"></main>

</div>

<script>

const scenarios = [

{
    title: "Clocking In",
    time: "7:56 AM",
    image: "scenario1.png",
    text: `
        <p>Your shift starts at <strong>8:00 AM</strong>.</p>

        <p>You arrive at the shop a few minutes early. You've always heard that <strong>being early for work is a good thing</strong>, and you want to make a good impression as the new technician.</p>

        <p>Your toolbox is across the shop, and you still need to put your belongings away and get yourself ready to work.</p>

        <p>The time clock is right by the entrance.</p>
    `,
    choices: [
        {
            title: "Clock in early.",
            text: "Being early shows initiative. Punch in now, then put your belongings away and get yourself ready before the shift officially starts.",
            professional: false
        },
        {
            title: "Get ready, then clock in.",
            text: "Use the few early minutes to put your things away and get completely ready, then punch in when you're prepared to begin working.",
            professional: true
        }
    ]
},

{
    title: "Customer Property",
    time: "8:20 AM",
    image: "scenario2.png",
    text: `
        <p>You just helped another technician remove a CV axle and have a <strong>small amount of grease on your hands</strong>.</p>

        <p>The service writer approaches you with an RO for a vehicle that needs a road test.</p>

        <div class="highlight">
            <strong>The customer is waiting and is in a hurry to leave.</strong>
        </div>
    `,
    choices: [
        {
            title: "Get the road test moving.",
            text: "Wipe your hands off with a shop towel, use the vehicle protection that's available, and get the waiting customer on the road as quickly as possible.",
            professional: false
        },
        {
            title: "Take a minute to clean up first.",
            text: "Wash your hands thoroughly before getting into the vehicle, even though it means the customer waits a little longer.",
            professional: true
        }
    ]
},

{
    title: "Protect Your Hearing or Keep Moving?",
    time: "8:45 AM",
    image: "scenario3.png",
    text: `
        <p>The customer you're working for is waiting, and the <strong>promise time on the RO is 9:00 AM</strong>.</p>

        <p>You still have about <strong>20 minutes of work left</strong>.</p>

        <p>The technician in the bay next to you starts using an <strong>air hammer</strong>. It's loud enough that you're having trouble hearing your Spotify playlist through your computer speakers.</p>

        <p>You don't have earplugs at your toolbox. To get proper hearing protection, you'll need to stop working and go to the <strong>parts department</strong> to get a pair.</p>
    `,
    choices: [
        {
            title: "Use what you have and keep moving.",
            text: "Put in your AirPods to cut down the noise and keep working so you don't lose more time on the already-tight promise time.",
            professional: false
        },
        {
            title: "Stop and get the shop PPE.",
            text: "Walk to parts for proper hearing protection, even though it costs you a few more minutes on a job that's already close to its promise time.",
            professional: true
        }
    ]
},

{
    title: "Final Check",
    time: "10:05 AM",
    image: "scenario4.png",
    text: `
        <p>You just finished a repair that required removing one of the wheels.</p>

        <p>The vehicle is back on the ground and you've completed the road test.</p>

        <p>As you're finishing the RO, you notice the torque wrench you used earlier is still sitting beside your lift.</p>

        <p>It's been a busy morning, and you've performed this repair many times before.</p>

        <p>The vehicle felt normal on the road test. Bringing it back in for another check will take additional time.</p>
    `,
    choices: [
        {
            title: "Finish the paperwork.",
            text: "The repair is complete, the road test felt normal, and you followed your usual process. Turn in the RO and move on.",
            professional: false
        },
        {
            title: "Verify it one more time.",
            text: "Pull the vehicle back into the bay and check the wheel torque again before the vehicle is released.",
            professional: true
        }
    ]
},

{
    title: "Nobody Told You To",
    time: "10:50 AM",
    image: "scenario5.png",
    text: `
        <p>You finish your current repair and turn in the RO.</p>

        <p>Your next assigned vehicle <strong>hasn't arrived yet</strong>.</p>

        <p>Your bay could use some cleanup, there are tools that need to be put away, and the technician next to you is still working on a larger job.</p>

        <p>Nobody has asked you to do anything.</p>
    `,
    choices: [
        {
            title: "Stay available for the next RO.",
            text: "Remain near your toolbox while you wait. You're caught up, and the next vehicle could arrive at any time.",
            professional: false
        },
        {
            title: "Use the gap in the schedule.",
            text: "Reset your bay, put tools away, or see whether the technician beside you could use a hand while you wait.",
            professional: true
        }
    ]
},

{
    title: "The Comeback",
    time: "11:20 AM",
    image: "scenario6.png",
    text: `
        <p>A vehicle you recently serviced returns to the shop with the <strong>Check Engine Light on</strong>.</p>

        <p>You scan it and find a stored DTC for <strong>Mass Air Flow Circuit / Performance</strong>.</p>

        <p>You pop the hood and immediately see the problem.</p>

        <p>When you replaced the engine air filter during its previous service, you accidentally left a <strong>hose to the airbox disconnected</strong>.</p>

        <p>You know exactly what caused the light.</p>
    `,
    choices: [
        {
            title: "Correct it and document what happened.",
            text: "Reconnect the hose and tell the service advisor and manager that the previous service caused the problem so the customer isn't charged.",
            professional: true
        },
        {
            title: "Correct the hose and handle the light as a service concern.",
            text: "Reconnect the hose, clear the code, and recommend a throttle body service based on the vehicle's condition instead of bringing up the previous mistake.",
            professional: false
        }
    ]
},

{
    title: "Lunch",
    time: "12:28 PM",
    image: "scenario7.png",
    text: `
        <p>You clocked out for your scheduled <strong>30-minute lunch at 12:00 PM</strong>.</p>

        <p>You're out with a few of the technicians you've been trying to get to know. They seem pretty relaxed about lunch and nobody has been watching the time closely.</p>

        <p>You look at your phone.</p>

        <div class="highlight">
            <strong>It's 12:28 PM.</strong>
        </div>

        <p>You're still a few minutes away from the shop. One of the guys shrugs and says, <strong>“We're always a couple minutes late. Nobody cares.”</strong></p>

        <p>You're the new tech. You don't want to act like the rule enforcer, rush everyone, or make yourself the guy who can't just go along with the group.</p>
    `,
    choices: [
        {
            title: "Stay with the group.",
            text: "They're the experienced guys and this seems normal here. Don't disrupt everyone's lunch over a couple of minutes—head back when they do.",
            professional: false
        },
        {
            title: "Head back on your own.",
            text: "Tell them you'll catch up with them at the shop and start heading back. You're new, and you'd rather not make being late part of your reputation.",
            professional: true
        }
    ]
},

{
    title: "Shop Banter",
    time: "1:15 PM",
    image: "scenario8.png",
    text: `
        <p>You're still building your tool collection, so you've had to borrow a few things from the technicians around you. One of the more experienced techs has told you before that you can borrow from his cart as long as you put things back.</p>

        <p>You walk over to return his <strong>10mm socket</strong>. As you set it down, he looks at the other guys and says:</p>

        <div class="quote">
            “Look at this guy. Three weeks in and he's already building his toolbox out of mine.”
        </div>

        <p>A couple of technicians laugh. Then he looks at you and adds, <strong>“I'm gonna have to start charging you rent.”</strong></p>

        <p>Shop banter is common, and you've joked around with these guys before. But you're also the new tech, everyone is laughing at you, and you're not completely sure whether he's messing with you or actually irritated that you've been borrowing his tools.</p>
    `,
    choices: [
        {
            title: "Fire back.",
            text: "If they're going to give you a hard time, don't just stand there and take it. Tell him he offered to let you borrow the tools and throw something back at him so everyone knows you can stick up for yourself.",
            professional: false
        },
        {
            title: "Check the boundary.",
            text: "Keep it calm and say, ‘If you're messing with me, we're good—but if you actually don't want me borrowing your stuff, just tell me.’ Give him a chance to make the line clear without turning it into a confrontation.",
            professional: true
        }
    ]
},

{
    title: "Receiving Criticism",
    time: "2:00 PM",
    image: "scenario9.png",
    text: `
        <p>Your manager calls you over to discuss a vehicle you worked on earlier in the week.</p>

        <p>The customer returned because a plastic splash shield underneath the vehicle came loose.</p>

        <div class="quote">
            “You need to slow down and pay more attention when you're putting vehicles back together. This can't keep happening.”
        </div>

        <p>You remember the vehicle, and you're pretty sure several of the clips were already damaged when it came in.</p>

        <p>Another technician is standing nearby and can hear the conversation.</p>
    `,
    choices: [
        {
            title: "Explain your side right away.",
            text: "Tell your manager that you remember the clips being damaged before you worked on the vehicle and that you don't believe you caused the problem.",
            professional: false
        },
        {
            title: "Let them finish, then add context.",
            text: "Hear your manager out first. Then explain what you observed and acknowledge that the damaged clips should have been documented.",
            professional: true
        }
    ]
},

{
    title: "But They Already Diagnosed It",
    time: "2:40 PM",
    image: "scenario10.png",
    text: `
        <p>The service advisor brings a customer into the shop who wants to speak directly with you.</p>

        <p>Before coming in, the customer stopped at a parts store because their <strong>Check Engine Light</strong> was on. The store scanned the vehicle and gave them a trouble-code printout.</p>

        <div class="quote">
            “They already diagnosed it for free. They said this code could just mean it needs this part. Why am I paying you diagnostic time to tell me the same thing?”
        </div>

        <p>You've already tested the vehicle using service information, equipment, and your knowledge of the system to determine the actual cause.</p>

        <div class="quote">
            “How do I know what you're recommending is actually going to fix my car?”
        </div>
    `,
    choices: [
        {
            title: "Draw a firm line.",
            text: "Explain that a code read is not a diagnosis, that your testing is what they're paying for, and that they can choose the parts-store recommendation instead if they trust it more.",
            professional: false
        },
        {
            title: "Walk them through your testing.",
            text: "Explain what the code means, what tests you performed, what the results showed, and how those results led to the repair you're recommending.",
            professional: true
        }
    ]
},

{
    title: "Wrong Part",
    time: "3:40 PM",
    image: "scenario11.png",
    text: `
        <p>You're trying to finish one of your last jobs of the day.</p>

        <p>You've removed the failed component and go to install the replacement.</p>

        <div class="highlight">
            <strong>It's the wrong part.</strong>

let currentScenario = 0;
let consequenceIndex = 0;
let answers = [];

const screen = document.getElementById("screen");
const statusText = document.getElementById("statusText");
const progressFill = document.getElementById("progressFill");
const progressTrack = document.getElementById("progressTrack");


function imageFallback(img) {
    const visual = img.closest(".scenario-visual, .review-visual");
    if (visual) visual.style.display = "none";
}

function scenarioVisual(s, number) {
    return `
        <div class="scenario-visual">
            <img src="${s.image}"
                 alt="Scenario ${number}: ${s.title}"
                 loading="eager"
                 onerror="imageFallback(this)">
            <div class="scenario-image-caption">Scenario ${number} • ${s.title}</div>
        </div>
    `;
}

function reviewVisual(filename, caption) {
    return `
        <div class="review-visual">
            <img src="${filename}"
                 alt="${caption}"
                 loading="eager"
                 onerror="imageFallback(this)">
            <div class="review-image-caption">${caption}</div>
        </div>
    `;
}

function setProgress(percent) {
    progressFill.style.width = percent + "%";
}

function showIntro() {

    statusText.textContent = "30-Day Probation";
    setProgress(0);

    screen.innerHTML = `
        <section class="card">

            <span class="eyebrow">Professionalism Simulation</span>

            <h1>CHOICES</h1>

            <p class="lead"><strong>Every choice has a consequence.</strong></p>

            <p>
                You're an entry-level automotive technician currently in the
                <strong>third week of your 30-day probationary period</strong>.
            </p>

            <p>
                You've had enough time to learn how the shop operates, meet your coworkers,
                and begin working independently.
            </p>

            <div class="highlight">
                At the end of your probationary period, management will decide whether
                to offer you a <strong>permanent position</strong>.
            </div>

            <p>
                Your technical ability matters—but that's not the only thing they're evaluating.
            </p>

            <p>
                Your reliability, judgment, safety, communication, attitude, integrity,
                and professionalism matter too.
            </p>

            <p>
                Today is another normal day at the shop.
            </p>

            <p><strong>The choices you make are yours.</strong></p>

            <br>

            <button class="primary" onclick="startSimulation()">
                START YOUR SHIFT →
            </button>

        </section>
    `;
}

function startSimulation() {
    currentScenario = 0;
    answers = [];

    scenarios.forEach(s => {
        const img = new Image();
        img.src = s.image;
    });

    ["bestscenario.png", "goodscenario.png", "terminationscenario.png"].forEach(src => {
        const img = new Image();
        img.src = src;
    });

    showScenario();
}

function showScenario() {

    const s = scenarios[currentScenario];

    statusText.textContent =
        `Scenario ${currentScenario + 1} of ${scenarios.length}`;

    setProgress(((currentScenario) / scenarios.length) * 70);

    screen.innerHTML = `
        <section class="card">

            <span class="eyebrow">
                Scenario ${currentScenario + 1} of ${scenarios.length}
            </span>

            <div class="time-pill">${s.time}</div>

            <h2>${s.title}</h2>

            ${scenarioVisual(s, currentScenario + 1)}

            ${s.text}

            <div class="choices">

                <button class="choice" onclick="choose(0)">
                    <span class="choice-letter">A</span>
                    <strong>${s.choices[0].title}</strong>
                    ${s.choices[0].text}
                </button>

                <button class="choice" onclick="choose(1)">
                    <span class="choice-letter">B</span>
                    <strong>${s.choices[1].title}</strong>
                    ${s.choices[1].text}
                </button>

            </div>

        </section>
    `;

    window.scrollTo({ top: 0, behavior: "smooth" });
}

function choose(choiceIndex) {

    answers.push(choiceIndex);

    currentScenario++;

    if (currentScenario < scenarios.length) {
        showScenario();
    } else {
        showConsequenceIntro();
    }
}

function showConsequenceIntro() {

    statusText.textContent = "Your Shift Is Over";
    setProgress(72);

    screen.innerHTML = `
        <section class="section-break">

            <span class="eyebrow" style="color:#ffd34e;">
                End of Shift
            </span>

            <h1>THE CONSEQUENCES</h1>

            <p>
                Throughout the day, you made decisions without knowing exactly
                how they would turn out.
            </p>

            <p>
                Some consequences were immediate.
                Others took time to appear.
            </p>

            <p><strong>Now you get to see what your choices created.</strong></p>

            <br>

            <button class="primary" onclick="startConsequences()">
                SEE WHAT HAPPENED →
            </button>

        </section>
    `;
}

function startConsequences() {
    consequenceIndex = 0;
    showConsequence();
}

function showConsequence() {

    const answer = answers[consequenceIndex];
    const scenario = scenarios[consequenceIndex];
    const result = consequences[consequenceIndex];

    let content;

    if (consequenceIndex === 11) {
        content = answer === 1 ? result.exceptional : result.normal;
    } else {
        const selectedChoice = scenario.choices[answer];
        content = selectedChoice.professional ? result.good : result.bad;
    }

    statusText.textContent =
        `Consequence ${consequenceIndex + 1} of ${consequences.length}`;

    setProgress(72 + ((consequenceIndex + 1) / consequences.length) * 18);

    screen.innerHTML = `
        <section class="card consequence">

            <span class="eyebrow">
                Your Choice — Scenario ${consequenceIndex + 1}
            </span>

            ${content}

            <br>

            <button class="primary" onclick="nextConsequence()">
                ${consequenceIndex === consequences.length - 1
                    ? "CONTINUE →"
                    : "NEXT CONSEQUENCE →"}
            </button>

        </section>
    `;

    window.scrollTo({ top: 0, behavior: "smooth" });
}

function nextConsequence() {

    consequenceIndex++;

    if (consequenceIndex < consequences.length) {
        showConsequence();
    } else {
        showReviewIntro();
    }
}

function showReviewIntro() {

    statusText.textContent = "30-Day Review";
    setProgress(94);

    screen.innerHTML = `
        <section class="section-break">

            <span class="eyebrow" style="color:#ffd34e;">
                One Week Later
            </span>

            <h1>YOUR 30-DAY REVIEW</h1>

            <p>
                Your probationary period is over.
            </p>

            <p>
                Your manager calls you into the office.
            </p>

            <p>
                They're ready to make a decision about your future with the shop.
            </p>

            <br>

            <button class="primary" onclick="showReview()">
                ENTER THE OFFICE →
            </button>

        </section>
    `;
}

function showReview() {

    let professionalCount = 0;

    for (let i = 0; i < scenarios.length; i++) {

        const selected =
            scenarios[i].choices[answers[i]];

        if (selected.professional) {
            professionalCount++;
        }
    }

    const integrityFailure =
        answers[5] === 1;

    const wheelFailure =
        answers[3] === 0;

    const perfectProfessional =
        professionalCount === 12;

    const exceptional =
        answers[11] === 1;

    let title;
    let body;
    let reviewImage;
    let reviewImageCaption;

    if (perfectProfessional && exceptional && !integrityFailure && !wheelFailure) {

        title = "POSITION OFFERED — OUTSTANDING REVIEW";
        reviewImage = "bestscenario.png";
        reviewImageCaption = "Permanent Position Offered";

        body = `
            <p>Your manager looks over your evaluation.</p>
            <div class="quote">“You've made a strong impression around here.”</div>
            <p>Your technical skills are developing exactly as expected for a new technician,
            but what has stood out most is <strong>how you approach the job</strong>.</p>
            <p>You've been reliable. You've worked safely. You've taken responsibility
            for your work. You've treated customers and coworkers professionally.
            You've shown initiative, good judgment, and integrity.</p>
            <p>Most importantly, you've shown the shop that <strong>you can be trusted</strong>.</p>
            <div class="highlight">
                <strong>Management offers you a permanent position.</strong><br><br>
                Completing probation also comes with a <strong>pay increase</strong>.
            </div>
            <p>Your manager adds:</p>
            <div class="quote">“Keep working like this.”</div>
            <p>If you continue demonstrating the same work ethic and professionalism,
            the shop plans to select you for <strong>advanced training and additional
            certification opportunities</strong> as you develop.</p>
            <p>The company is willing to invest in you because you've shown that
            <strong>you're willing to invest in yourself.</strong></p>
        `;

    } else if (professionalCount >= 7 && !integrityFailure) {

        title = "PROBATION EXTENDED";
        reviewImage = "goodscenario.png";
        reviewImageCaption = "Probation Extended";

        body = `
            <p>Your manager sees potential—but also sees a pattern that concerns them.</p>
            <p>You've demonstrated good technical ability in several situations,
            and there are clear signs that you can become a valuable technician.</p>
            <p>At the same time, your reliability, judgment, communication,
            safety habits, attention to detail, or professionalism
            has not been consistent enough yet.</p>
            <div class="highlight">
                Management decides to <strong>extend your probationary period</strong>
                rather than offer you the permanent position today.
            </div>
            <p>This is not a termination. The shop is giving you more time because
            management believes there is still something worth developing.</p>
            <p>Now they need to see whether you can turn individual good decisions
            into a <strong>consistent professional pattern</strong>.</p>
            <p><strong>You've been given another opportunity. What you do with it is another choice.</strong></p>
        `;

    } else {

        title = "POSITION NOT OFFERED";
        reviewImage = "terminationscenario.png";
        reviewImageCaption = "Employment Ends After Probation";

        body = `
            <p>Your manager closes the evaluation.</p>
            <p>No single mistake made this decision.</p>
            <p>The concern is the <strong>pattern created by your choices</strong>:
            reliability, judgment, customer service, safety, teamwork,
            accountability, or integrity.</p>
            <div class="highlight">
                <strong>The shop decides not to offer you a permanent position
                after your probationary period.</strong>
            </div>
            <p>Technical ability matters.</p>
            <p>But employers also have to be able to trust the people representing
            their business and working on their customers' vehicles.</p>
        `;
    }

    statusText.textContent = "Probation Complete";
    setProgress(100);

    screen.innerHTML = `
        <section class="card review-card">

            <span class="eyebrow">30-Day Performance Review</span>

            <h2>${title}</h2>

            ${reviewVisual(reviewImage, reviewImageCaption)}

            ${body}

            <hr style="border:none;border-top:1px solid #d7e0e5;margin:35px 0;">

            <div class="final-message">

                <h2>YOUR CHOICES CREATED YOUR REPUTATION.</h2>

                <p>
                    None of these decisions seemed career-changing when you made them.
                </p>

                <p>
                    Clocking in. Washing your hands. Wearing PPE. Checking your work.
                    Owning a mistake. Helping a coworker. Talking to a customer.
                </p>

                <p>
                    <strong>Your employer wasn't evaluating one decision.</strong>
                </p>

                <p>
                    <strong>They were evaluating the pattern created by all of them.</strong>
                </p>

                <p class="lead">
                    That's professionalism.
                </p>

                <br>

                <button class="secondary" onclick="restartSimulation()">
                    RESTART ACTIVITY
                </button>

            </div>

        </section>
    `;

    window.scrollTo({ top: 0, behavior: "smooth" });
}

function restartSimulation() {
    currentScenario = 0;
    consequenceIndex = 0;
    answers = [];
    showIntro();
}

showIntro();
