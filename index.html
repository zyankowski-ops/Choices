<title>Choices | Professionalism</title>

<style>
    * {
        box-sizing: border-box;
    }

    html, body {
        margin: 0;
        padding: 0;
        min-height: 100%;
        font-family: Arial, Helvetica, sans-serif;
        background:
            radial-gradient(circle at top, #24485f 0%, #142b3a 40%, #09141d 100%);
        color: #ffffff;
    }

    body {
        min-height: 100vh;
    }

    .app {
        width: min(920px, 94%);
        margin: 0 auto;
        padding: 35px 0 60px;
    }

    .topbar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 20px;
        margin-bottom: 18px;
        color: #c8d5dd;
        font-size: 0.92rem;
    }

    .brand {
        font-weight: 800;
        letter-spacing: 0.14em;
        color: #ffd34e;
    }

    .progress-track {
        width: 100%;
        height: 8px;
        background: rgba(255,255,255,0.12);
        border-radius: 999px;
        overflow: hidden;
        margin-bottom: 28px;
    }

    .progress-fill {
        height: 100%;
        width: 0;
        background: #ffd34e;
        transition: width 0.35s ease;
    }

    .card {
        background: rgba(255,255,255,0.96);
        color: #18232b;
        border-radius: 18px;
        padding: 38px;
        box-shadow: 0 18px 55px rgba(0,0,0,0.35);
        border-top: 7px solid #ffd34e;
    }

    .eyebrow {
        display: inline-block;
        font-size: 0.8rem;
        font-weight: 800;
        letter-spacing: 0.13em;
        text-transform: uppercase;
        color: #2a5673;
        margin-bottom: 12px;
    }

    h1 {
        margin: 0 0 18px;
        font-size: clamp(2rem, 5vw, 3.5rem);
        line-height: 1;
        color: #17384d;
    }

    h2 {
        margin-top: 0;
        color: #17384d;
        font-size: clamp(1.7rem, 4vw, 2.5rem);
    }

    h3 {
        color: #17384d;
        margin-bottom: 8px;
    }

    p {
        font-size: 1.08rem;
        line-height: 1.65;
    }

    .lead {
        font-size: 1.22rem;
    }

    .highlight {
        background: #eef4f7;
        border-left: 5px solid #2a5673;
        border-radius: 8px;
        padding: 18px 20px;
        margin: 22px 0;
    }

    .quote {
        background: #f7f3df;
        border-left: 5px solid #d5a900;
        padding: 17px 20px;
        border-radius: 8px;
        font-weight: 700;
        margin: 20px 0;
    }

    .time-pill {
        display: inline-block;
        padding: 8px 14px;
        background: #17384d;
        color: white;
        border-radius: 999px;
        font-weight: 800;
        margin-bottom: 15px;
    }

    .choices {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 18px;
        margin-top: 30px;
    }

    .choice {
        border: 2px solid #ccd8df;
        background: #f8fafb;
        border-radius: 14px;
        padding: 22px;
        text-align: left;
        cursor: pointer;
        transition: 0.18s ease;
        min-height: 175px;
        color: #17232b;
    }

    .choice:hover {
        transform: translateY(-3px);
        border-color: #2a5673;
        box-shadow: 0 10px 25px rgba(0,0,0,0.12);
    }

    .choice strong {
        display: block;
        color: #17384d;
        font-size: 1.12rem;
        margin-bottom: 9px;
    }

    .choice-letter {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 34px;
        height: 34px;
        border-radius: 50%;
        background: #ffd34e;
        color: #17232b;
        font-weight: 900;
        margin-bottom: 12px;
    }

    button.primary {
        border: none;
        background: #ffd34e;
        color: #17232b;
        padding: 15px 25px;
        border-radius: 10px;
        font-size: 1rem;
        font-weight: 900;
        cursor: pointer;
        transition: 0.18s ease;
    }

    button.primary:hover {
        transform: translateY(-2px);
        background: #ffe073;
    }

    button.secondary {
        border: 2px solid #2a5673;
        background: transparent;
        color: #17384d;
        padding: 13px 23px;
        border-radius: 10px;
        font-size: 1rem;
        font-weight: 800;
        cursor: pointer;
    }

    .consequence {
        border-left: 6px solid #d5a900;
    }

    .review-card {
        border-top-color: #2a5673;
    }

    .review-result {
        font-size: 1.35rem;
        font-weight: 900;
        color: #17384d;
        margin: 20px 0;
    }

    .final-message {
        text-align: center;
        padding-top: 10px;
    }

    .final-message h2 {
        font-size: clamp(2rem, 5vw, 3.2rem);
    }

    .small {
        font-size: 0.92rem;
        color: #53636d;
    }

    .hidden {
        display: none;
    }

    .section-break {
        text-align: center;
        color: #ffffff;
        padding: 70px 15px;
    }

    .section-break h1 {
        color: #ffd34e;
    }

    .section-break p {
        color: #dce6ec;
        max-width: 650px;
        margin-left: auto;
        margin-right: auto;
    }

    @media (max-width: 700px) {
        .app {
            width: 95%;
            padding-top: 18px;
        }

        .card {
            padding: 25px 20px;
        }

        .choices {
            grid-template-columns: 1fr;
        }

        .choice {
            min-height: auto;
        }

        .topbar {
            font-size: 0.8rem;
        }
    }
</style>
</head>

},

{
    bad: `
        <h2>Management Gets Involved</h2>
        <p>Your manager approaches you later in the day.</p>
        <p>They already know the parts department ordered the wrong component.</p>
        <p><strong>That's not what they want to discuss.</strong></p>
        <p>They want to discuss how you spoke to another employee after that employee admitted making a mistake.</p>
    `,
    good: `
        <h2>The Correct Part Arrives</h2>
        <p>The parts employee brings the correct component directly to your bay and apologizes again.</p>
        <p>You finish the repair.</p>
        <p>Neither of you needed management involved.</p>
        <p><strong>The problem stayed a parts problem instead of becoming a people problem.</strong></p>
    `
},

{
    normal: `
        <h2>Your Shift Ends</h2>
        <p>You leave at your scheduled time and make your date.</p>
        <p>The battery job is handled by someone else or the following morning.</p>
        <p><strong>Your shift was over. You were not obligated to stay.</strong></p>
    `,
    exceptional: `
        <h2>You Stay</h2>
        <p>You text your date that you're going to be late and replace the battery.</p>
        <p>The stranded customer gets back on the road.</p>
        <p>The next morning, your manager approaches you.</p>
        <div class="quote">
            “I heard you stayed to take care of that battery last night. You didn't have to do that.”
            <br><br>
            “I noticed that you did.”
        </div>
    `
}

];

let currentScenario = 0;
let consequenceIndex = 0;
let answers = [];

const screen = document.getElementById("screen");
const statusText = document.getElementById("statusText");
const progressFill = document.getElementById("progressFill");
const progressTrack = document.getElementById("progressTrack");

function setProgress(percent) {
    progressFill.style.width = percent + "%";
}

function showIntro() {

    statusText.textContent = "30-Day Probation";
    setProgress(0);

    screen.innerHTML = `
        <section class="card">

            <span class="eyebrow">Professionalism Simulation</span>

            <h1>CHOICES</h1>

            <p class="lead"><strong>Every choice has a consequence.</strong></p>

            <p>
                You're an entry-level automotive technician currently in the
                <strong>third week of your 30-day probationary period</strong>.
            </p>

            <p>
                You've had enough time to learn how the shop operates, meet your coworkers,
                and begin working independently.
            </p>

            <div class="highlight">
                At the end of your probationary period, management will decide whether
                to offer you a <strong>permanent position</strong>.
            </div>

            <p>
                Your technical ability matters—but that's not the only thing they're evaluating.
            </p>

            <p>
                Your reliability, judgment, safety, communication, attitude, integrity,
                and professionalism matter too.
            </p>

            <p>
                Today is another normal day at the shop.
            </p>

            <p><strong>The choices you make are yours.</strong></p>

            <br>

            <button class="primary" onclick="startSimulation()">
                START YOUR SHIFT →
            </button>

        </section>
    `;
}

function startSimulation() {
    currentScenario = 0;
    answers = [];
    showScenario();
}

function showScenario() {

    const s = scenarios[currentScenario];

    statusText.textContent =
        `Scenario ${currentScenario + 1} of ${scenarios.length}`;

    setProgress(((currentScenario) / scenarios.length) * 70);

    screen.innerHTML = `
        <section class="card">

            <span class="eyebrow">
                Scenario ${currentScenario + 1} of ${scenarios.length}
            </span>

            <div class="time-pill">${s.time}</div>

            <h2>${s.title}</h2>

            ${s.text}

            <div class="choices">

                <button class="choice" onclick="choose(0)">
                    <span class="choice-letter">A</span>
                    <strong>${s.choices[0].title}</strong>
                    ${s.choices[0].text}
                </button>

                <button class="choice" onclick="choose(1)">
                    <span class="choice-letter">B</span>
                    <strong>${s.choices[1].title}</strong>
                    ${s.choices[1].text}
                </button>

            </div>

        </section>
    `;

    window.scrollTo({ top: 0, behavior: "smooth" });
}

function choose(choiceIndex) {

    answers.push(choiceIndex);

    currentScenario++;

    if (currentScenario < scenarios.length) {
        showScenario();
    } else {
        showConsequenceIntro();
    }
}

function showConsequenceIntro() {

    statusText.textContent = "Your Shift Is Over";
    setProgress(72);

    screen.innerHTML = `
        <section class="section-break">

            <span class="eyebrow" style="color:#ffd34e;">
                End of Shift
            </span>

            <h1>THE CONSEQUENCES</h1>

            <p>
                Throughout the day, you made decisions without knowing exactly
                how they would turn out.
            </p>

            <p>
                Some consequences were immediate.
                Others took time to appear.
            </p>

            <p><strong>Now you get to see what your choices created.</strong></p>

            <br>

            <button class="primary" onclick="startConsequences()">
                SEE WHAT HAPPENED →
            </button>

        </section>
    `;
}

function startConsequences() {
    consequenceIndex = 0;
    showConsequence();
}

function showConsequence() {

    const answer = answers[consequenceIndex];
    const scenario = scenarios[consequenceIndex];
    const result = consequences[consequenceIndex];

    let content;

    if (consequenceIndex === 11) {
        content = answer === 1 ? result.exceptional : result.normal;
    } else {
        const selectedChoice = scenario.choices[answer];
        content = selectedChoice.professional ? result.good : result.bad;
    }

    statusText.textContent =
        `Consequence ${consequenceIndex + 1} of ${consequences.length}`;

    setProgress(72 + ((consequenceIndex + 1) / consequences.length) * 18);

    screen.innerHTML = `
        <section class="card consequence">

            <span class="eyebrow">
                Your Choice — Scenario ${consequenceIndex + 1}
            </span>

            ${content}

            <br>

            <button class="primary" onclick="nextConsequence()">
                ${consequenceIndex === consequences.length - 1
                    ? "CONTINUE →"
                    : "NEXT CONSEQUENCE →"}
            </button>

        </section>
    `;

    window.scrollTo({ top: 0, behavior: "smooth" });
}

function nextConsequence() {

    consequenceIndex++;

    if (consequenceIndex < consequences.length) {
        showConsequence();
    } else {
        showReviewIntro();
    }
}

function showReviewIntro() {

    statusText.textContent = "30-Day Review";
    setProgress(94);

    screen.innerHTML = `
        <section class="section-break">

            <span class="eyebrow" style="color:#ffd34e;">
                One Week Later
            </span>

            <h1>YOUR 30-DAY REVIEW</h1>

            <p>
                Your probationary period is over.
            </p>

            <p>
                Your manager calls you into the office.
            </p>

            <p>
                They're ready to make a decision about your future with the shop.
            </p>

            <br>

            <button class="primary" onclick="showReview()">
                ENTER THE OFFICE →
            </button>

        </section>
    `;
}

function showReview() {

    let professionalCount = 0;

    for (let i = 0; i < scenarios.length; i++) {

        const selected =
            scenarios[i].choices[answers[i]];

        if (selected.professional) {
            professionalCount++;
        }
    }

    const integrityFailure =
        answers[5] === 1;

    const wheelFailure =
        answers[3] === 0;

    const perfectProfessional =
        professionalCount === 12;

    const exceptional =
        answers[11] === 1;

    let title;
    let body;

    if (perfectProfessional && exceptional) {

        title = "POSITION OFFERED — OUTSTANDING REVIEW";

        body = `
            <p>Your manager looks over your evaluation.</p>

            <div class="quote">
                “You've made a strong impression around here.”
            </div>

            <p>
                Your technical skills are developing exactly as expected for a new technician,
                but what has stood out most is <strong>how you approach the job</strong>.
            </p>

            <p>
                You've been reliable. You've worked safely. You've taken responsibility
                for your work. You've treated customers and coworkers professionally.
                You've shown initiative, good judgment, and integrity.
            </p>

            <p>
                Most importantly, you've shown the shop that
                <strong>you can be trusted</strong>.
            </p>

            <div class="highlight">
                <strong>Management offers you a permanent position.</strong>
                <br><br>
                Completing probation also comes with a <strong>pay increase</strong>.
            </div>

            <p>Your manager adds:</p>

            <div class="quote">
                “Keep working like this.”
            </div>

            <p>
                If you continue demonstrating the same work ethic and professionalism,
                the shop plans to select you for
                <strong>advanced training and additional certification opportunities</strong>
                as you develop.
            </p>

            <p>
                The company is willing to invest in you because you've shown that
                <strong>you're willing to invest in yourself.</strong>
            </p>
        `;

    } else if (professionalCount >= 10 && !integrityFailure && !wheelFailure) {

        title = "POSITION OFFERED";

        body = `
            <p>
                Your manager tells you that you've successfully completed your probationary period.
            </p>

            <p>
                You've shown that you can be relied upon and that you're developing into
                a technician the shop wants to keep.
            </p>

            <div class="highlight">
                <strong>You are offered a permanent position and receive the pay increase
                that comes with completing probation.</strong>
            </div>

            <p>
                Your manager also points out a few situations where your judgment or
                professionalism could improve.
            </p>

            <p>
                You're expected to learn from those situations as you continue developing.
            </p>
        `;

    } else if (professionalCount >= 7 && !integrityFailure) {

        title = "PROBATION EXTENDED";

        body = `
            <p>Your manager sees potential—but also sees a pattern that concerns them.</p>

            <p>
                You've demonstrated good technical ability in some situations,
                but your reliability, judgment, communication, or professionalism
                has not been consistent enough yet.
            </p>

            <div class="highlight">
                Management decides to <strong>extend your probationary period</strong>
                rather than offer you the permanent position today.
            </div>

            <p>
                You've been given another opportunity.
            </p>

            <p><strong>What you do with it is another choice.</strong></p>
        `;

    } else {

        title = "POSITION NOT OFFERED";

        body = `
            <p>Your manager closes the evaluation.</p>

            <p>
                No single mistake made this decision.
            </p>

            <p>
                The concern is the <strong>pattern created by your choices</strong>:
                reliability, judgment, customer service, safety, teamwork,
                accountability, or integrity.
            </p>

            <div class="highlight">
                <strong>The shop decides not to offer you a permanent position
                after your probationary period.</strong>
            </div>

            <p>
                Technical ability matters.
            </p>

            <p>
                But employers also have to be able to trust the people representing
                their business and working on their customers' vehicles.
            </p>
        `;
    }

    statusText.textContent = "Probation Complete";
    setProgress(100);

    screen.innerHTML = `
        <section class="card review-card">

            <span class="eyebrow">30-Day Performance Review</span>

            <h2>${title}</h2>

            ${body}

            <hr style="border:none;border-top:1px solid #d7e0e5;margin:35px 0;">

            <div class="final-message">

                <h2>YOUR CHOICES CREATED YOUR REPUTATION.</h2>

                <p>
                    None of these decisions seemed career-changing when you made them.
                </p>

                <p>
                    Clocking in. Washing your hands. Wearing PPE. Checking your work.
                    Owning a mistake. Helping a coworker. Talking to a customer.
                </p>

                <p>
                    <strong>Your employer wasn't evaluating one decision.</strong>
                </p>

                <p>
                    <strong>They were evaluating the pattern created by all of them.</strong>
                </p>

                <p class="lead">
                    That's professionalism.
                </p>

                <br>

                <button class="secondary" onclick="restartSimulation()">
                    RESTART ACTIVITY
                </button>

            </div>

        </section>
    `;

    window.scrollTo({ top: 0, behavior: "smooth" });
}

function restartSimulation() {
    currentScenario = 0;
    consequenceIndex = 0;
    answers = [];
    showIntro();
}

showIntro();

</script>

</body>
</html>
